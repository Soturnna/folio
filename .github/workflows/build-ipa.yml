name: Compilar IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Escolher o Xcode estável mais recente
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Mostrar versões
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos
          echo "::notice title=Ambiente::$(xcodebuild -version | tr '\n' ' ') | $(xcodebuild -showsdks | grep -o 'iphoneos[0-9.]*' | head -1)"

      - name: Instalar o XcodeGen e o renderizador de SVG
        run: brew install xcodegen librsvg

      - name: Gerar o ícone 1024x1024 a partir do SVG
        run: |
          rsvg-convert -w 1024 -h 1024 -b "#16181C" design/icon.svg \
            -o Folio/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          rsvg-convert -w 600 -h 600 -b "#16181C" design/icon.svg \
            -o Folio/Resources/Assets.xcassets/NowPlayingArt.imageset/NowPlayingArt.png
          rsvg-convert -w 120 -h 120 -b "#16181C" design/icon.svg \
            -o FolioWidgets/Assets.xcassets/FolioMark.imageset/FolioMark.png

      - name: Gerar o projeto Xcode
        run: xcodegen generate

      - name: Compilar (sem assinatura)
        run: |
          set -o pipefail
          xcodebuild \
            -project Folio.xcodeproj \
            -scheme Folio \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -iE "error|failed" build.log | sort -u | head -40 | while read -r l; do echo "::error::${l: -300}"; done
          tail -25 build.log | while read -r l; do echo "::notice::${l: -300}"; done
          test -d build/Build/Products/Release-iphoneos/Folio.app
          test -d build/Build/Products/Release-iphoneos/Folio.app/PlugIns/FolioWidgets.appex

      - name: Empacotar o .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Folio.app Payload/
          zip -qry Folio.ipa Payload
          ls -lh Folio.ipa

      - name: Publicar o .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Folio-ipa
          path: Folio.ipa
          retention-days: 30

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Folio 1.1 (build ${{ github.run_number }})
          make_latest: true
          files: Folio.ipa
          body: |
            Instale com o Sideloadly usando seu Apple ID.
            Link fixo da versão mais recente: https://github.com/${{ github.repository }}/releases/latest/download/Folio.ipa

      - name: Publicar o log em caso de erro
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
